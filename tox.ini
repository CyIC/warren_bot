[tox]
envlist = clean,flake8,pylint,py313,coverage-report
requires = tox>=4.22
skip_missing_interpreters = True
labels =
    lint = flake8,pylint
    check = clean,flake8,pylint,py313,type,security,coverage-report

[testenv]
# tox builds/installs the package via the poetry-core backend (isolated_build).
# Tooling versions come from the PEP 735 [dependency-groups] table in
# pyproject.toml (single source of truth); reference groups by name only.
dependency_groups =
    test
setenv =
    PYTHONPATH = {toxinidir}/src
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    pytest {posargs} \
    --cov=src/warren_bot \
    --cov-report=term-missing \
    --cov-report=xml:{toxworkdir}/coverage-{envname}.xml \
    --cov-report=html:{toxworkdir}/htmlcov-{envname} \
    --junitxml={toxworkdir}/junit-{envname}.xml \
    src/tests/
depends = clean

[testenv:clean]
description = Clean up coverage and test artifacts
skip_install = true
dependency_groups =
    coverage
commands =
    coverage erase
    python -c "import shutil, pathlib; [shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path(r'{toxworkdir}').glob('htmlcov-*')]"
    python -c "import pathlib; [p.unlink(missing_ok=True) for p in pathlib.Path(r'{toxworkdir}').glob('coverage-*.xml')]"
    python -c "import pathlib; [p.unlink(missing_ok=True) for p in pathlib.Path(r'{toxworkdir}').glob('junit-*.xml')]"

[testenv:flake8]
description = Run flake8 linting
skip_install = true
dependency_groups =
    flake8
commands =
    flake8 src/warren_bot/ {posargs}


[testenv:pylint]
description = Run pylint static analysis
dependency_groups =
    pylint
commands =
    pylint src/warren_bot/ {posargs}


[testenv:security]
description = Run security checks with bandit (code) and pip-audit (dependencies)
dependency_groups =
    security
commands =
    bandit -r src/warren_bot/ -f json -o {toxworkdir}/bandit-report.json
    bandit -r src/warren_bot/
    pip-audit

[testenv:format]
description = Format code with black
skip_install = true
dependency_groups =
    format
commands =
    black src/ --check --diff {posargs}

[testenv:format-fix]
description = Fix code formatting with black
skip_install = true
dependency_groups =
    format
commands =
    black src/ {posargs}

[testenv:type]
description = Run type checking with mypy
skip_install = true
dependency_groups =
    type
commands =
    mypy src/warren_bot/ {posargs}

[testenv:coverage-report]
description = Combine coverage reports from all test runs
skip_install = true
dependency_groups =
    coverage
depends = py313
parallel_show_output = true
# Override the per-env COVERAGE_FILE inherited from [testenv] so combine/report
# read and write the aggregated data file, not a stray .coverage.coverage-report.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --show-missing --fail-under=70
    coverage html -d {toxworkdir}/htmlcov-combined
    coverage xml -o {toxworkdir}/coverage-combined.xml

[testenv:all]
description = Run all quality checks
skip_install = true
depends = clean,py313,flake8,pylint,security,type,coverage-report
commands =
    python -c "print('All quality checks completed successfully!')"

# Configuration sections
# pytest and coverage config live in pyproject.toml ([tool.pytest.ini_options],
# [tool.coverage.*]). flake8 has no pyproject support, so it stays here.
[flake8]
max-line-length = 120
max-complexity = 10
# E501: line too long (handled by black); D401: first line should be in imperative mood
extend-ignore = E501,D401
per-file-ignores =
    src/tests/*:D100,D101,D102,D103,D104,S101,S106
    src/warren_bot/__init__.py:F401
    src/warren_bot/utilities.py:W503
exclude =
    .git,
    __pycache__,
    .tox,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist,
    .pytest_cache
