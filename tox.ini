[tox]
envlist = clean,flake8,pylint,py313
isolated_build = True

[testenv]
allowlist_externals = poetry
commands_pre =
    pip install poetry
    poetry install
commands =
    poetry run pytest --cov=src/warren_bot src/tests/ --cov-append --junitxml=junit/test-results.xml --cov-report=xml --cov-report=html

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[pytest]
pythonpath = ./src

[testenv:flake8]
skip_install = True
depends = clean
deps =
    flake8
    flake8-docstrings>=1.3.1
    pep8-naming
exclude = src/tests
commands =
    poetry run flake8 --ignore=E501,D401 src/warren_bot

[flake8]
D102 : Missing docstring in public method
D401 : First line should be in imperative mood; try rephrasing
max-line-length = 100
per-file-ignores =
    utilities.py: W503
;	test_data_dict.py: D102,D101
;	test_utilities.py: D102,D101
;	test_report_thread.py: D102,D101
;	test_gui_handler.py: D102,D101

[testenv:pylint]
skip_install = True
depends = clean
ignore-patterns = **/tests/**
commands =
    poetry run pylint src

[testenv:py310]
depends = clean

[testenv:py311]
depends = clean

[testenv:py312]
depends = clean

[testenv:py313]
depends = clean
