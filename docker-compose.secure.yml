services:
  warren-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WARREN_VERSION: "0.1.0"
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    
    container_name: warren-bot-secure
    hostname: warren-bot
    
    # Security: Restart policy
    restart: unless-stopped
    
    # Security: Read-only root filesystem
    read_only: true
    
    # Security: Run as non-root user
    user: "65532:65532"  # nonroot user from chainguard
    
    # Security: Drop all capabilities and add only required ones
    cap_drop:
      - ALL
    # cap_add: []  # Add only if needed (e.g., NET_BIND_SERVICE for port 80)
    
    # Security: No privileged mode
    privileged: false
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # May need adjustment based on requirements
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Security: Temporary filesystems for writable areas
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/logs:noexec,nosuid,size=50m
    
    # Security: Environment variables (secrets should be via files or external secrets)
    environment:
      - DISCORD_TOKEN_FILE=/run/secrets/discord_token
      - DISCORD_APP_ID=${DISCORD_APP_ID:-}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY:-}
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - CLUB_INFO_FILE=/app/config/club_info.json
      - CLUB_STOCKS_FILE=/app/config/club_stocks.csv
      # PYTHONPATH intentionally omitted: the venv on PATH resolves its own site-packages,
      # so this stays correct across Python minor-version changes (no hardcoded python3.13).
    
    # Security: Secrets management (Docker Swarm secrets)
    secrets:
      - discord_token
    
    # Security: Volume mounts with restricted permissions
    volumes:
      # Configuration files (read-only)
      - type: bind
        source: ./club_info.json
        target: /app/config/club_info.json
        read_only: true
      - type: bind
        source: ./club_stocks.csv
        target: /app/config/club_stocks.csv
        read_only: true
      
      # Data persistence (read-write with restricted access)
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: true
      
      # Logs (write-only, with logrotate handling)
      - type: tmpfs
        target: /app/logs
        tmpfs:
          size: 100m
          mode: 0750
    
    # Security: Network configuration
    networks:
      - warren-bot-internal
    
    # Security: No host networking
    network_mode: bridge
    
    # Security: Disable host port mapping unless absolutely necessary
    # ports: []
    
    # Security: Health check
    healthcheck:
      test: [ "CMD", "/app/.venv/bin/python", "-c", "import warren_bot; import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Security: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,version,environment"
    
    # Security: Labels for monitoring and management
    labels:
      - "traefik.enable=false"  # Disable if using Traefik
      - "com.docker.compose.service=warren-bot"
      - "security.policy=restricted"
      - "backup.enable=true"
      - "backup.path=/app/data"

# Security: Secrets definition (for Docker Swarm mode)
secrets:
  discord_token:
    file: ./secrets/discord_token.txt

# Security: Custom network with restricted access
networks:
  warren-bot-internal:
    driver: bridge
    internal: false  # Set to true if no external network access needed
    ipam:
      config:
        - subnet: 172.20.0.0/24
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"

# Security: Volume definitions with access controls
volumes:
  warren-data:
    driver: local
    driver_opts:
      type: none
      device: "${PWD}/data"
      o: bind,uid=65532,gid=65532